# Release do ASTOS: binários onefile (Linux/Windows/macOS) + .deb/.rpm + PyPI files.
#
# - push de tag `v*` (ex.: `git tag v0.4.0 && git push origin v0.4.0`) ou
#   disparo manual (`workflow_dispatch`) gera todos os artefatos;
# - em tag, publica GitHub Release com os arquivos anexados.
# Simplicidade preservada: `pip install astos` continua o caminho principal;
# os binários são para quem não tem Python.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binary:
    name: binário ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            artifact: binary-linux
          - os: windows-latest
            sep: ";"
            artifact: binary-windows
          - os: macos-latest
            sep: ":"
            artifact: binary-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build onefile
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .
          pyinstaller --noconfirm --clean --onefile --name astos \
            --add-data "astos/vendor${{ matrix.sep }}astos/vendor" \
            packaging/pyinstaller-entry.py
      - name: smoke test
        run: ./dist/astos --help
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/astos*

  pydist:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: py-dist
          path: dist/*

  release:
    name: pacotes + GitHub Release
    needs: [binary, pydist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux
          path: dist-linux
      - uses: actions/download-artifact@v4
        with:
          name: py-dist
          path: dist
      - name: ajusta versão (strip v)
        run: echo "ASTOS_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
        shell: bash
      - name: deb
        uses: blinktag/nfpm@v2.27.1
        with:
          config: packaging/nfpm.yaml
          packager: deb
      - name: rpm
        uses: blinktag/nfpm@v2.27.1
        with:
          config: packaging/nfpm.yaml
          packager: rpm
      - name: publica Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-linux/astos
            dist/*
            *.deb
            *.rpm
