[project]
name = "astos"
version = "0.1.1"
description = "ASTOS — Abstract Syntax Tree Observer Service. Mapa 3D imersivo e 100% offline do seu repositório."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ASTOS" }]
keywords = ["ast", "graph", "3d", "three.js", "webgl", "cli", "visualization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Documentation",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["click>=8.0"]

[project.urls]
Homepage = "https://github.com/HonoravelMacho/astos"
Repository = "https://github.com/HonoravelMacho/astos"

[project.scripts]
astos = "astos.cli:main"

[tool.setuptools.package-data]
astos = ["vendor/*.js"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["astos*"]
